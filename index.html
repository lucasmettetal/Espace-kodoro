<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO primaire -->
    <title>Espace Ködörö — Coworking & Événementiel à Caussade</title>
    <meta name="description" content="Espace Ködörö à Caussade (82) : espace de coworking et lieu événementiel. Soirées gaming, activités et événements communautaires au cœur du Quercy Blanc." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.espace-kodoro.fr/" />

    <!-- Open Graph (Facebook, WhatsApp…) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.espace-kodoro.fr/" />
    <meta property="og:title" content="Espace Ködörö — Coworking & Événementiel à Caussade" />
    <meta property="og:description" content="Coworking et événementiel au cœur de Caussade : soirées gaming, activités, formations et événements communautaires." />
    <meta property="og:locale" content="fr_FR" />
    <!-- og:image à ajouter lorsque vous aurez une photo de couverture -->
    <!-- <meta property="og:image" content="https://www.espace-kodoro.fr/og-cover.jpg" /> -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Espace Ködörö — Coworking & Événementiel à Caussade" />
    <meta name="twitter:description" content="Coworking et événementiel à Caussade : soirées gaming, activités et événements communautaires." />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />

    <!-- Données structurées JSON-LD (SEO local Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Espace Ködörö",
      "description": "Espace de coworking et lieu événementiel à Caussade : soirées gaming, activités et événements communautaires.",
      "url": "https://www.espace-kodoro.fr/",
      "email": "espacekodoro@gmail.com",
      "foundingDate": "2020",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "25 boulevard Didier Rey",
        "addressLocality": "Caussade",
        "postalCode": "82300",
        "addressCountry": "FR"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
          "opens": "09:00",
          "closes": "19:00"
        }
      ],
      "amenityFeature": [
        { "@type": "LocationFeatureSpecification", "name": "Coworking", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Salle événementielle", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Salle d'événements", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Wifi haut débit", "value": true }
      ]
    }
    </script>

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
